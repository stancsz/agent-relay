name: Agent Relay CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install --editable ".[dev]"
      - name: Validate skill
        run: python scripts/validate_skill.py skills/agent-relay
      - name: Compile Python
        shell: pwsh
        run: python -m compileall -q src tests evals
      - name: Run tests
        run: python -m pytest
      - name: Smoke canonical CLI
        shell: pwsh
        run: |
          agent-relay --help
          agent-relay lanes --json
